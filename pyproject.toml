[project]
name = "rag-template"
version = "0.1.0"
description = "Reusable RAG template for FastAPI projects"
readme = "README.md"
authors = [
    { name = "sohila gamal", email = "sohilagamal30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
rag-template = "rag_template:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
